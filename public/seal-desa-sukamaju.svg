<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Lambang Desa Sukamaju">
  <title>Lambang Desa Sukamaju</title>
  <defs>
    <clipPath id="sealClip">
      <circle cx="60" cy="60" r="56" />
    </clipPath>
  </defs>

  <!-- Outer ring -->
  <circle cx="60" cy="60" r="58" fill="#0F172A" />
  <circle cx="60" cy="60" r="55" fill="#1E3A8A" />
  <circle cx="60" cy="60" r="46" fill="#FFFFFF" />
  <circle cx="60" cy="60" r="46" fill="none" stroke="#0F172A" stroke-width="1.5" />

  <g clip-path="url(#sealClip)">
    <!-- Rice stalk, left -->
    <g stroke="#0F172A" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M44 74 C40 62 40 50 46 40" />
      <path d="M46 40 l-3 5" />
    </g>
    <g fill="#1E3A8A">
      <ellipse cx="42" cy="58" rx="3.4" ry="1.9" transform="rotate(-34 42 58)" />
      <ellipse cx="41" cy="52" rx="3.4" ry="1.9" transform="rotate(-30 41 52)" />
      <ellipse cx="41.5" cy="46" rx="3.4" ry="1.9" transform="rotate(-26 41.5 46)" />
      <ellipse cx="44" cy="41" rx="3.2" ry="1.8" transform="rotate(-20 44 41)" />
      <ellipse cx="46.6" cy="63" rx="3.4" ry="1.9" transform="rotate(-18 46.6 63)" />
      <ellipse cx="46" cy="57" rx="3.4" ry="1.9" transform="rotate(-14 46 57)" />
      <ellipse cx="46.5" cy="51" rx="3.4" ry="1.9" transform="rotate(-10 46.5 51)" />
      <ellipse cx="48.5" cy="46" rx="3.2" ry="1.8" transform="rotate(-6 48.5 46)" />
    </g>

    <!-- Cotton branch, right -->
    <g stroke="#0F172A" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M76 74 C80 62 80 50 74 40" />
    </g>
    <g fill="#B45309">
      <circle cx="78" cy="58" r="3.2" />
      <circle cx="79" cy="52" r="3.2" />
      <circle cx="78.5" cy="46" r="3.2" />
      <circle cx="76" cy="41" r="3" />
      <circle cx="73.4" cy="63" r="3.2" />
      <circle cx="74" cy="57" r="3.2" />
      <circle cx="73.5" cy="51" r="3.2" />
      <circle cx="71.5" cy="46" r="3" />
    </g>

    <!-- Five-pointed star -->
    <path d="M60 20 L63.4 29.2 L73 29.6 L65.4 35.5 L68 44.6 L60 39.4 L52 44.6 L54.6 35.5 L47 29.6 L56.6 29.2 Z"
      fill="#0F172A" />

    <!-- Central field: mountain, sawah, river -->
    <path d="M30 84 L48 62 L60 76 L72 60 L90 84 Z" fill="#1E3A8A" />
    <path d="M30 84 L48 62 L60 76 L72 60 L90 84 Z" fill="none" stroke="#0F172A" stroke-width="1.4" />
    <path d="M30 84 H90 V88 H30 Z" fill="#0F172A" />
    <g stroke="#FFFFFF" stroke-width="1" opacity="0.85">
      <path d="M34 84 h14" />
      <path d="M56 84 h14" />
      <path d="M72 84 h12" />
    </g>
  </g>

  <!-- Scroll with village name -->
  <g>
    <rect x="18" y="88" width="84" height="15" rx="2.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.4" />
    <text x="60" y="99.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
      font-size="9.5" font-weight="bold" letter-spacing="0.9" fill="#0F172A">SUKAMAJU</text>
  </g>

  <!-- Ring inscription -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="7.6" font-weight="bold" fill="#FFFFFF" letter-spacing="1.6">
    <text x="60" y="15.5" text-anchor="middle">KABUPATEN BANDUNG</text>
  </g>
</svg>
